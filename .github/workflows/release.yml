# I'll be honest, I let ChatGPT write this one, I don't know GitHub CI as well as I do GitLab CI.
name: Release

on:
    workflow_dispatch:
        inputs:
            tag:
                description: "Upstream tag (e.g. 20260222-0)"
                required: true
                type: string

concurrency:
    group: release
    cancel-in-progress: false

permissions:
    contents: write

jobs:
    prepare:
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@v7

            -   name: Setup PHP
                uses: shivammathur/setup-php@v2
                with:
                  php-version: "8.3"

            -   name: Install ImageMagick
                run: sudo apt-get update && sudo apt-get install -y imagemagick

            -   name: Run prepare.php
                env:
                    UPSTREAM_TAG: ${{ inputs.tag }}
                run: php scripts/prepare.php "$UPSTREAM_TAG"

            -   name: Upload prepared files
                uses: actions/upload-artifact@v7
                with:
                    name: prepared
                    path: |
                        prepared/ytpa.js
                        prepared/builder.js
                        prepared/meta.json
                    if-no-files-found: error

            -   name: Upload generated icons
                uses: actions/upload-artifact@v7
                with:
                    name: generated-icons
                    path: public/icon-*.png
                    if-no-files-found: error

    build-and-release:
        runs-on: ubuntu-latest
        needs: prepare

        steps:
            - uses: actions/checkout@v7

            -   name: Download prepared files
                uses: actions/download-artifact@v8
                with:
                    name: prepared
                    path: prepared

            -   name: Download generated icons
                uses: actions/download-artifact@v8
                with:
                    name: generated-icons
                    path: public

            -   name: Compute release tag
                id: tag
                env:
                    GH_TOKEN: ${{ github.token }}
                    REPO: ${{ github.repository }}
                shell: bash
                run: |
                    set -euo pipefail

                    release_tag="v$(jq -er .browserVersion prepared/meta.json)"
                    if gh api "repos/$REPO/releases/tags/$release_tag" >/dev/null 2>&1; then
                      echo "Release $release_tag already exists." >&2
                      exit 1
                    fi

                    echo "release_tag=${release_tag}" >> "$GITHUB_OUTPUT"
                    echo "upstream_tag=$(jq -er .version prepared/meta.json)" >> "$GITHUB_OUTPUT"

            -   name: Setup Node
                uses: actions/setup-node@v7
                with:
                  node-version: "24"
                  cache: "npm"

            -   run: npm ci
            -   run: npm run zip -- --mv2 -b firefox
            -   run: npm run zip -- --mv3 -b chromium

            -   name: Verify output zips exist
                shell: bash
                run: |
                  set -euo pipefail
                  chromium_zip="$(find ./.output -maxdepth 1 -name '*-chromium.zip' -print -quit)"
                  firefox_zip="$(find ./.output -maxdepth 1 -name '*-firefox.zip' -print -quit)"
                  test -n "$chromium_zip"
                  test -n "$firefox_zip"

                  chromium_version="$(unzip -p "$chromium_zip" manifest.json | jq -r .version)"
                  firefox_version="$(unzip -p "$firefox_zip" manifest.json | jq -r .version)"
                  test "$chromium_version" = "$firefox_version"

                  IFS='.' read -r -a version_parts <<< "$chromium_version"
                  test "${#version_parts[@]}" -ge 1
                  test "${#version_parts[@]}" -le 4
                  for part in "${version_parts[@]}"; do
                    [[ "$part" =~ ^(0|[1-9][0-9]*)$ ]]
                    (( part >= 0 && part <= 65535 ))
                  done

            -   name: Upload release packages
                uses: actions/upload-artifact@v7
                with:
                    name: release-packages-${{ steps.tag.outputs.release_tag }}
                    path: |
                        ./.output/*-chromium.zip
                        ./.output/*-firefox.zip
                        ./.output/*-sources.zip
                    if-no-files-found: error
                    include-hidden-files: true

            -   name: Create GitHub Release with both zips
                uses: softprops/action-gh-release@v3
                with:
                  tag_name: ${{ steps.tag.outputs.release_tag }}
                  name: ${{ steps.tag.outputs.release_tag }}
                  body: |
                      Built from upstream [v${{ steps.tag.outputs.upstream_tag }}](https://github.com/RobertWesner/YouTube-Play-All/releases/tag/v${{ steps.tag.outputs.upstream_tag }}).
                  generate_release_notes: true
                  files: |
                      ./.output/*-chromium.zip
                      ./.output/*-firefox.zip
                env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
